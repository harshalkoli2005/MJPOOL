<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Add Employee</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

<div class="card shadow p-4 mt-5 mx-auto" style="max-width:700px;">

<h3 class="mb-4 text-primary">
Add New Employee
</h3>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>Name</label>
<input type="text" name="name" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Mobile</label>
<input type="text" name="mobile" class="form-control" maxlength="10" required>
</div>

<div class="col-md-6 mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Role</label>

<select name="role" class="form-select">

<option>Technician</option>
<option>Supervisor</option>
<option>Cleaner</option>

</select>

</div>

<div class="col-md-12 mb-3">
<label>Address</label>
<textarea name="address" class="form-control" rows="2"></textarea>
</div>

<div class="col-md-12 mb-3">
<label>Password</label>
<input type="password" name="password" class="form-control" required>
</div>

</div>

<button class="btn btn-success w-100">
Save Employee
</button>

</form>

</div>

</div>
  <!-- =========================
     EMPLOYEE ERROR MODAL
========================= -->

{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

<div class="modal fade"
     id="employeeErrorModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 shadow-lg">

            <div class="modal-header bg-danger text-white">

                <h5 class="modal-title">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>
                    Employee Not Added
                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body text-center p-4">

                {% for category, message in messages %}

                    <i class="fa-solid fa-triangle-exclamation text-danger"
                       style="font-size:45px;">
                    </i>

                    <p class="mt-3 mb-0 fs-5">
                        {{ message }}
                    </p>

                {% endfor %}

            </div>


            <div class="modal-footer justify-content-center">

                <button
                    type="button"
                    class="btn btn-danger px-4"
                    data-bs-dismiss="modal">

                    OK

                </button>

            </div>

        </div>

    </div>

</div>

{% endif %}

{% endwith %}


<!-- Bootstrap JS -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const errorModal =
        document.getElementById("employeeErrorModal");

    if (errorModal) {

        const modal =
            new bootstrap.Modal(errorModal);

        modal.show();

    }

});

</script>
</body>
</html>
