<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container">


    <div
        class="card shadow p-4 mt-5 mx-auto"
        style="max-width:700px;"
    >


        <h3 class="mb-4">
            Edit Service
        </h3>


        <form method="POST">


            <!-- Service Name -->

            <label class="form-label">
                Service Name
            </label>

            <input
                type="text"
                name="service_name"
                value="{{ service.service_name }}"
                class="form-control mb-3"
                required
            >


            <!-- Small Price -->

            <label class="form-label">
                Small Pool Price
            </label>

            <div class="input-group mb-3">

                <span class="input-group-text">
                    ₹
                </span>

                <input
                    type="number"
                    name="small_price"
                    value="{{ service_prices.get('Small', '') }}"
                    class="form-control"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- Medium Price -->

            <label class="form-label">
                Medium Pool Price
            </label>

            <div class="input-group mb-3">

                <span class="input-group-text">
                    ₹
                </span>

                <input
                    type="number"
                    name="medium_price"
                    value="{{ service_prices.get('Medium', '') }}"
                    class="form-control"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- Large Price -->

            <label class="form-label">
                Large Pool Price
            </label>

            <div class="input-group mb-3">

                <span class="input-group-text">
                    ₹
                </span>

                <input
                    type="number"
                    name="large_price"
                    value="{{ service_prices.get('Large', '') }}"
                    class="form-control"
                    min="0"
                    step="0.01"
                    required
                >

            </div>


            <!-- Duration -->

            <label class="form-label">
                Duration
            </label>

            <input
                type="text"
                name="duration"
                value="{{ service.duration }}"
                class="form-control mb-3"
                required
            >


            <!-- Description -->

            <label class="form-label">
                Description
            </label>

            <textarea
                name="description"
                class="form-control mb-3"
                rows="4"
            >{{ service.description }}</textarea>


            <!-- Status -->

            <label class="form-label">
                Status
            </label>

            <select
                name="status"
                class="form-select mb-4"
            >

                <option
                    value="Active"
                    {% if service.status == "Active" %}
                        selected
                    {% endif %}
                >
                    Active
                </option>

                <option
                    value="Inactive"
                    {% if service.status == "Inactive" %}
                        selected
                    {% endif %}
                >
                    Inactive
                </option>

            </select>


            <!-- Buttons -->

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    Update Service
                </button>

                <a
                    href="/admin/services"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>


        </form>


    </div>


</div>


</body>

</html>
