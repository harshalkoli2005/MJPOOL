<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Add New Service</h4>
        </div>

        <div class="card-body">

            <form method="POST"
                  action="/admin/services/add">

                <!-- Service Name -->
                <div class="mb-3">

                    <label class="form-label">
                        Service Name
                    </label>

                    <input
                        type="text"
                        name="service_name"
                        class="form-control"
                        placeholder="Enter service name"
                        required
                    >

                </div>


                <!-- Small Pool Price -->
                <div class="mb-3">

                    <label class="form-label">
                        Small Pool Price
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            ₹
                        </span>

                        <input
                            type="number"
                            name="small_price"
                            class="form-control"
                            min="0"
                            step="0.01"
                            placeholder="Enter Small pool price"
                            required
                        >

                    </div>

                </div>


                <!-- Medium Pool Price -->
                <div class="mb-3">

                    <label class="form-label">
                        Medium Pool Price
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            ₹
                        </span>

                        <input
                            type="number"
                            name="medium_price"
                            class="form-control"
                            min="0"
                            step="0.01"
                            placeholder="Enter Medium pool price"
                            required
                        >

                    </div>

                </div>


                <!-- Large Pool Price -->
                <div class="mb-3">

                    <label class="form-label">
                        Large Pool Price
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            ₹
                        </span>

                        <input
                            type="number"
                            name="large_price"
                            class="form-control"
                            min="0"
                            step="0.01"
                            placeholder="Enter Large pool price"
                            required
                        >

                    </div>

                </div>


                <!-- Duration -->
                <div class="mb-3">

                    <label class="form-label">
                        Duration
                    </label>

                    <input
                        type="text"
                        name="duration"
                        class="form-control"
                        placeholder="Example: 1 hour"
                        required
                    >

                </div>


                <!-- Description -->
                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Enter service description"
                    ></textarea>

                </div>


                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Add Service
                    </button>

                    <a
                        href="/admin/services"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
