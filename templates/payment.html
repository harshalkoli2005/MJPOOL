<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Payment - MJ Pool Services
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fa;
        }

        .payment-card {

            max-width: 500px;

            margin: 80px auto;

            background: white;

            border-radius: 15px;

            padding: 30px;

            box-shadow:
                0 5px 25px
                rgba(0, 0, 0, 0.08);
        }

        .amount {

            font-size: 32px;

            font-weight: 700;

            color: #0d6efd;
        }

        .booking-id {

            font-weight: 600;

            color: #0d6efd;
        }

        .demo-badge {

            display: inline-block;

            background: #fff3cd;

            color: #856404;

            padding: 6px 14px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 600;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="payment-card text-center">


        <div class="demo-badge mb-3">

            DEMO PAYMENT

        </div>


        <h2 class="mb-3">

            Complete Your Payment

        </h2>


        <p class="text-muted mb-4">

            Pay 30% advance to confirm your booking.

        </p>


        <!-- Booking ID -->

        <div class="mb-3">

            <small class="text-muted">

                Booking ID

            </small>

            <div class="booking-id">

                {{ booking.booking_id }}

            </div>

        </div>


        <!-- Total -->

        <div class="mb-3">

            <small class="text-muted">

                Total Amount

            </small>

            <div>

                ₹{{ booking.total_amount }}

            </div>

        </div>


        <!-- Advance -->

        <div class="mb-4">

            <small class="text-muted">

                Advance Payment (30%)

            </small>

            <div class="amount">

                ₹{{ booking.advance_amount }}

            </div>

        </div>


        <!-- Demo Payment Form -->

        <form
            method="POST"
            action="/payment/demo-success"
        >

            <input
                type="hidden"
                name="booking_id"
                value="{{ booking.booking_id }}"
            >


            <button
                type="submit"
                class="btn btn-primary btn-lg w-100"
            >

                Pay ₹{{ booking.advance_amount }}

            </button>

        </form>


        <p class="text-muted small mt-3 mb-0">

            This is a college project demo.
            No real money will be charged.

        </p>


    </div>


</div>


</body>

</html>
